{% extends "base.html" %}
{% block content %}
<form method="post" action="/transactions" class="max-w-xl bg-slate-900 rounded-2xl p-4 shadow">
  <label class="block text-slate-300 text-sm mb-1">Amount</label>
  <input id="amount" name="amount" inputmode="decimal" required
         class="w-full text-3xl bg-slate-800 rounded-xl px-3 py-2 focus:outline-none"
         placeholder="0.00" />

  {% include "components/numpad.html" %}

  <div class="mt-4 grid grid-cols-1 gap-3">
    <div>
      <label class="block text-slate-300 text-sm mb-1">Kind</label>
      <div class="flex gap-3">
        <label class="inline-flex items-center gap-2"><input type="radio" name="kind" value="expense" checked> Expense</label>
        <label class="inline-flex items-center gap-2"><input type="radio" name="kind" value="income"> Income</label>
      </div>
    </div>
    <div>
      <label class="block text-slate-300 text-sm mb-1">Account</label>
      <select name="account_id" class="w-full bg-slate-800 rounded-xl px-3 py-2">
        {% for id, name in accounts %}
          <option value="{{id}}">{{name}}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-slate-300 text-sm mb-1">Category (optional)</label>
      <select name="category_id" class="w-full bg-slate-800 rounded-xl px-3 py-2">
        <option value="">— none —</option>
        {% for id, name in categories %}
          <option value="{{id}}">{{name}}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-slate-300 text-sm mb-1">Payee (optional)</label>
      <input name="payee" class="w-full bg-slate-800 rounded-xl px-3 py-2" placeholder="Store or person"/>
    </div>
    <div>
      <label class="block text-slate-300 text-sm mb-1">Memo (optional)</label>
      <input name="memo" class="w-full bg-slate-800 rounded-xl px-3 py-2" placeholder="Note"/>
    </div>
  </div>

  <div class="mt-5 flex justify-end gap-3">
    <a href="/" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700">Cancel</a>
    <button class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white">Save</button>
  </div>
</form>
{% endblock %}
