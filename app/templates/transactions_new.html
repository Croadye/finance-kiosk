{% extends "base.html" %}
{% block content %}

<form method="post" action="/transactions" class="max-w-3xl bg-slate-900 rounded-2xl p-4 shadow space-y-4" onsubmit="return syncTotalBeforeSubmit()">
  <h2 class="text-lg font-semibold">New Transaction</h2>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
    <div>
      <label class="block text-sm text-slate-300 mb-1">Date</label>
      <input type="date" name="tx_date" value="{{ today }}" required class="w-full bg-slate-800 rounded-xl px-3 py-2">
    </div>

    <div>
      <label class="block text-sm text-slate-300 mb-1">Account</label>
      <select name="account_id" class="w-full bg-slate-800 rounded-xl px-3 py-2" required>
        {% for id, name in accounts %}
          <option value="{{ id }}">{{ name }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label class="block text-sm text-slate-300 mb-1">Kind</label>
      <div class="flex items-center gap-6">
        <label class="inline-flex items-center gap-2">
          <input type="radio" name="kind" value="expense" checked> Expense
        </label>
        <label class="inline-flex items-center gap-2">
          <input type="radio" name="kind" value="income"> Income
        </label>
      </div>
    </div>

    <div>
      <label class="block text-sm text-slate-300 mb-1">Payee</label>
      <input name="payee" placeholder="Who was paid / who paid you" class="w-full bg-slate-800 rounded-xl px-3 py-2">
    </div>

    <div class="md:col-span-2">
      <label class="block text-sm text-slate-300 mb-1">Memo</label>
      <input name="memo" placeholder="Optional note" class="w-full bg-slate-800 rounded-xl px-3 py-2">
    </div>
  </div>

  <div class="pt-1">
   <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
      <div class="flex items-center gap-3">
        <h3 class="font-semibold">Splits</h3>
        <a href="/categories" class="text-xs text-indigo-300 hover:text-indigo-200">Manage categories</a>
      </div>
      <div class="space-x-2">
        <button type="button" class="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700" onclick="addSplit()">Add split</button>
        <button type="button" class="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700" onclick="clearSplits()">Clear</button>
      </div>
    </div>

    <div class="overflow-x-auto">
      <table id="splitsTable" class="min-w-full text-sm">
        <thead class="text-slate-400">
          <tr>
            <th class="text-left py-2 pr-2">Category</th>
            <th class="text-left py-2 pr-2">Memo</th>
            <th class="text-right py-2 pr-2">Amount</th>
            <th class="py-2"></th>
          </tr>
        </thead>
        <tbody id="splitsBody"></tbody>
        <tfoot>
          <tr class="border-t border-slate-800">
            <td></td><td class="text-right py-2 pr-2 font-medium">Total</td>
            <td class="text-right py-2 pr-2 font-semibold"><span id="splitsTotal">0.00</span></td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>
    <p class="text-xs text-slate-400 mt-1">Tip: Enter positive numbers. We’ll apply the sign based on Expense/Income.</p>
  </div>

  <!-- Fallback single-amount if no splits given -->
  <div>
    <label class="block text-sm text-slate-300 mb-1">Amount (used only if no splits)</label>
    <input name="amount" id="fallbackAmount" inputmode="decimal" value="0.00" class="w-48 bg-slate-800 rounded-xl px-3 py-2 text-right">
  </div>

  <div class="pt-2 flex justify-end gap-2">
    <a href="/transactions" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700">Cancel</a>
    <button class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white">Save</button>
  </div>
</form>

<script>
  const categories = {{ categories_js | tojson | safe }};
  function currency(n){ return (Math.round(n*100)/100).toFixed(2); }

  function addSplit(catId="", memo="", amt=""){
    const tr = document.createElement('tr');
    tr.className = "border-b border-slate-800";
    tr.innerHTML = `
      <td class="py-2 pr-2">
        <select name="split_category_id" class="bg-slate-800 rounded-xl px-3 py-2">
          ${categories.map(([id,name]) => `<option value="${id}" ${catId==id?'selected':''}>${name}</option>`).join('')}
        </select>
      </td>
      <td class="py-2 pr-2">
        <input name="split_memo" value="${memo}" class="w-full bg-slate-800 rounded-xl px-3 py-2">
      </td>
      <td class="py-2 pr-2 text-right">
        <input name="split_amount" inputmode="decimal" value="${amt||''}" class="w-32 bg-slate-800 rounded-xl px-3 py-2 text-right" oninput="recalc()">
      </td>
      <td class="py-2 pl-2">
        <button type="button" class="px-2 py-1 rounded-lg bg-rose-600 hover:bg-rose-500 text-white" onclick="this.closest('tr').remove(); recalc();">Remove</button>
      </td>`;
    document.getElementById('splitsBody').appendChild(tr);
    recalc();
  }

  function clearSplits(){
    document.getElementById('splitsBody').innerHTML="";
    recalc();
  }

  function recalc(){
    let total = 0;
    document.querySelectorAll('input[name="split_amount"]').forEach(inp=>{
      const v = parseFloat((inp.value||"").replace(/,/g,""));
      if(!isNaN(v)) total += Math.abs(v);
    });
    document.getElementById('splitsTotal').textContent = currency(total);
  }

  function syncTotalBeforeSubmit(){
    // If splits exist, mirror their sum into the fallback field (not strictly needed, but nice for visibility).
    const rows = document.querySelectorAll('#splitsBody tr').length;
    if(rows>0){
      document.getElementById('fallbackAmount').value = document.getElementById('splitsTotal').textContent;
    }
    return true;
  }

  // Start with one empty row for convenience
  addSplit();
</script>

{% endblock %}
