{% extends "base.html" %}
{% block content %}
<form method="post" action="/transactions/{{ tx.id }}/edit" class="max-w-3xl bg-slate-900 rounded-2xl p-4 shadow space-y-4">
  <h2 class="text-lg font-semibold">Edit Transaction</h2>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
    <div>
      <label class="block text-slate-300 text-sm mb-1">Kind</label>
      <label class="inline-flex items-center gap-2 mr-4"><input type="radio" name="kind" value="expense" {% if kind=='expense' %}checked{% endif %}> Expense</label>
      <label class="inline-flex items-center gap-2"><input type="radio" name="kind" value="income" {% if kind=='income' %}checked{% endif %}> Income</label>
    </div>
    <div>
      <label class="block text-slate-300 text-sm mb-1">Account</label>
      <select name="account_id" class="w-full bg-slate-800 rounded-xl px-3 py-2">
        {% for id, name in accounts %}
          <option value="{{id}}" {% if id==tx.account_id %}selected{% endif %}>{{name}}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-slate-300 text-sm mb-1">Payee (optional)</label>
      <input name="payee" value="{{ tx.payee or '' }}" class="w-full bg-slate-800 rounded-xl px-3 py-2"/>
    </div>
    <div>
      <label class="block text-slate-300 text-sm mb-1">Memo (optional)</label>
      <input name="memo" value="{{ tx.memo or '' }}" class="w-full bg-slate-800 rounded-xl px-3 py-2"/>
    </div>
  </div>

  <div class="mt-2">
    <div class="flex items-center justify-between mb-2">
      <h3 class="font-semibold">Splits</h3>
      <button type="button" id="addRow" class="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700">+ Add split</button>
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-full text-left text-sm" id="splitTable">
        <thead class="text-slate-400">
          <tr>
            <th class="py-2 pr-4">Category</th>
            <th class="py-2 pr-4 text-right">Amount</th>
            <th class="py-2 pr-2"></th>
          </tr>
        </thead>
        <tbody>
          {% for s in splits %}
          <tr class="border-b border-slate-800">
            <td class="py-2 pr-4">
              <select name="split_category_id" class="w-64 bg-slate-800 rounded-xl px-3 py-2">
                <option value="">— none —</option>
                {% for id,name in categories %}
                  <option value="{{id}}" {% if id==s.category_id %}selected{% endif %}>{{name}}</option>
                {% endfor %}
              </select>
            </td>
            <td class="py-2 pr-4 text-right">
              <input name="split_amount" inputmode="decimal" value="{{'%.2f'|format((s.amount or 0) | abs) }}"
                     class="w-32 text-right bg-slate-800 rounded-xl px-2 py-1 recalc">
            </td>
            <td class="py-2 pr-2 text-right">
              <button type="button" class="px-2 py-1 bg-rose-600 hover:bg-rose-500 text-white rounded-lg rmRow">Remove</button>
            </td>
          </tr>
          {% endfor %}
          {% if splits|length == 0 %}
          <tr class="border-b border-slate-800">
            <td class="py-2 pr-4">
              <select name="split_category_id" class="w-64 bg-slate-800 rounded-xl px-3 py-2">
                <option value="">— none —</option>
                {% for id,name in categories %}<option value="{{id}}">{{name}}</option>{% endfor %}
              </select>
            </td>
            <td class="py-2 pr-4 text-right">
              <input name="split_amount" inputmode="decimal" value="{{ '%.2f'|format((s.total_abs) | abs) }}"
                     class="w-32 text-right bg-slate-800 rounded-xl px-2 py-1 recalc">
            </td>
            <td class="py-2 pr-2 text-right">
              <button type="button" class="px-2 py-1 bg-rose-600 hover:bg-rose-500 text-white rounded-lg rmRow">Remove</button>
            </td>
          </tr>
          {% endif %}
        </tbody>
      </table>
    </div>

    <div class="mt-3 text-right text-slate-300">
      <span>Total of splits:</span>
      <span id="totalSplits" class="font-semibold">${{ '%.2f'|format(total_abs) }}</span>
      <span class="text-xs text-slate-400 ml-2">(transaction total follows split sum)</span>
    </div>
  </div>

  <div class="mt-4 flex justify-between">
    <a href="/transactions" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700">Back</a>
    <div class="space-x-2">
      <button formaction="/transactions/{{ tx.id }}/delete" formmethod="post"
              class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white"
              onclick="return confirm('Delete this transaction?');">Delete</button>
      <button class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white">Save</button>
    </div>
  </div>
</form>

<script>
  const optionsHtml = `<option value="">— none —</option>` +
  `{% for id,name in categories %}<option value="{{id}}">{{name}}</option>{% endfor %}`;

  function recalc() {
    let sum = 0;
    document.querySelectorAll('input[name="split_amount"]').forEach(inp => {
      const v = parseFloat((inp.value || "0").replace(/,/g, ''));
      if (!isNaN(v)) sum += v;
    });
    document.getElementById('totalSplits').textContent = '$' + sum.toFixed(2);
  }
  document.addEventListener('input', e => { if (e.target.classList.contains('recalc')) recalc(); });

  document.getElementById('addRow').addEventListener('click', () => {
    const tbody = document.querySelector('#splitTable tbody');
    const tr = document.createElement('tr');
    tr.className = 'border-b border-slate-800';
    tr.innerHTML = `
      <td class="py-2 pr-4">
        <select name="split_category_id" class="w-64 bg-slate-800 rounded-xl px-3 py-2">${optionsHtml}</select>
      </td>
      <td class="py-2 pr-4 text-right">
        <input name="split_amount" inputmode="decimal" value="" class="w-32 text-right bg-slate-800 rounded-xl px-2 py-1 recalc">
      </td>
      <td class="py-2 pr-2 text-right">
        <button type="button" class="px-2 py-1 bg-rose-600 hover:bg-rose-500 text-white rounded-lg rmRow">Remove</button>
      </td>`;
    tbody.appendChild(tr);
  });

  document.addEventListener('click', e => {
    if (e.target.classList.contains('rmRow')) {
      e.target.closest('tr').remove();
      recalc();
    }
  });

  recalc();
</script>
{% endblock %}
