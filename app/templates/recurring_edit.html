{% extends "base.html" %}
{% block content %}
<form id="recurring-form" method="post" action="/recurring/{{ b.id }}/edit" class="max-w-xl bg-slate-900 rounded-2xl p-4 shadow space-y-3">
  <h2 class="text-lg font-semibold">Edit Recurring Item</h2>

  {% if err == 'same_accounts' %}
  <div class="px-3 py-2 bg-rose-900/40 border border-rose-700 rounded-xl text-sm text-rose-200">
    From and to accounts must be different for a transfer.
  </div>
  {% elif err == 'missing_account' %}
  <div class="px-3 py-2 bg-rose-900/40 border border-rose-700 rounded-xl text-sm text-rose-200">
    Select at least one account to post this item.
  </div>
  {% endif %}

  <div>
    <label class="block text-sm text-slate-300 mb-1">Name</label>
    <input name="name" value="{{ b.name }}" class="w-full bg-slate-800 rounded-xl px-3 py-2" required>
  </div>

  <div>
    <label class="block text-sm text-slate-300 mb-1">Kind</label>
    <label class="inline-flex items-center gap-2 mr-4">
      <input type="radio" name="kind" value="expense" {% if kind=='expense' %}checked{% endif %}> Expense
    </label>
    <label class="inline-flex items-center gap-2">
      <input type="radio" name="kind" value="income" {% if kind=='income' %}checked{% endif %}> Income
    </label>
  </div>

  <div>
    <label class="block text-sm text-slate-300 mb-1">Amount</label>
    <input name="amount" inputmode="decimal" value="{{ '%.2f'|format(abs_amount) }}"
           class="w-full bg-slate-800 rounded-xl px-3 py-2" required>
  </div>

  <div>
    <label class="block text-sm text-slate-300 mb-1">Cadence</label>
    <select name="cadence" class="w-full bg-slate-800 rounded-xl px-3 py-2">
      <option value="monthly" {% if b.cadence=='monthly' %}selected{% endif %}>Monthly</option>
      <option value="biweekly" {% if b.cadence=='biweekly' %}selected{% endif %}>Biweekly</option>
      <option value="weekly" {% if b.cadence=='weekly' %}selected{% endif %}>Weekly</option>
    </select>
  </div>

  <div>
    <label class="block text-sm text-slate-300 mb-1">Next due date</label>
    <input type="date" name="next_due" value="{{ b.next_due }}" class="w-full bg-slate-800 rounded-xl px-3 py-2">
  </div>

  <div>
    <label class="block text-sm text-slate-300 mb-1">From account</label>
    <select name="from_account_id" class="w-full bg-slate-800 rounded-xl px-3 py-2">
      <option value="">— none —</option>
      {% for id, name in accounts %}
      <option value="{{id}}" {% if id==b.from_account_id %}selected{% endif %}>{{name}}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label class="block text-sm text-slate-300 mb-1">To account</label>
    <select name="to_account_id" class="w-full bg-slate-800 rounded-xl px-3 py-2">
      <option value="">— none —</option>
      {% for id, name in accounts %}
      <option value="{{id}}" {% if id==b.to_account_id %}selected{% endif %}>{{name}}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label class="block text-sm text-slate-300 mb-1">Category</label>
    <select name="category_id" class="w-full bg-slate-800 rounded-xl px-3 py-2">
      <option value="">— none —</option>
      {% for id, name in categories %}
      <option value="{{id}}" {% if id==b.category_id %}selected{% endif %}>{{name}}</option>
      {% endfor %}
    </select>
  </div>

  <div class="flex items-center gap-2 mt-2">
    <input id="autopost" type="checkbox" name="autopost" value="1" {% if b.autopost %}checked{% endif %} class="scale-125">
    <label for="autopost" class="text-slate-300">Autopost (uncheck to ask each time)</label>
  </div>

  <div class="pt-3 flex justify-between">
    <a href="/recurring" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700">Back</a>
    <div class="space-x-2">
      <button formaction="/recurring/{{ b.id }}/delete" formmethod="post"
              onclick="return confirm('Delete this item?');"
              class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white">Delete</button>
      <button class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white">Save</button>
    </div>
  </div>
</form>
<script>
(function() {
  const form = document.getElementById('recurring-form');
  if (!form) return;
  const fromSelect = form.querySelector('select[name="from_account_id"]');
  const toSelect = form.querySelector('select[name="to_account_id"]');
  const categorySelect = form.querySelector('select[name="category_id"]');
  const warningId = 'account-warning';

  function updateCategoryState() {
    const isTransfer = fromSelect.value && toSelect.value;
    categorySelect.disabled = isTransfer;
    let note = document.getElementById(warningId);
    if (isTransfer) {
      if (!note) {
        note = document.createElement('p');
        note.id = warningId;
        note.className = 'text-xs text-slate-400';
        categorySelect.parentElement.appendChild(note);
      }
      note.textContent = 'Category is disabled for transfers.';
    } else if (note) {
      note.remove();
    }
  }

  function validateForm(event) {
    if (!fromSelect.value && !toSelect.value) {
      event.preventDefault();
      alert('Select at least one account.');
      return false;
    }
    if (fromSelect.value && toSelect.value && fromSelect.value === toSelect.value) {
      event.preventDefault();
      alert('From and to accounts must be different.');
      return false;
    }
    return true;
  }

  fromSelect.addEventListener('change', updateCategoryState);
  toSelect.addEventListener('change', updateCategoryState);
  updateCategoryState();
  form.addEventListener('submit', validateForm);
})();
</script>
{% endblock %}
