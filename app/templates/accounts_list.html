{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-between mb-3">
  <h2 class="text-xl font-semibold">Accounts</h2>
  <a href="/accounts/new" class="px-3 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white">+ New</a>
</div>

<div class="overflow-x-auto">
  <table class="min-w-full text-left text-sm">
    <thead class="text-slate-400">
      <tr>
        <th class="py-2 pr-4">Name</th>
        <th class="py-2 pr-4">Type</th>
        <th class="py-2 pr-4 text-right">Balance</th>
        <th class="py-2 pr-2"></th>
      </tr>
    </thead>
    <tbody>
      {% for r in rows %}
      <tr class="border-b border-slate-800 {% if r.arch %}opacity-60{% endif %}">
        <td class="py-2 pr-4">{{ r.name }}</td>
        <td class="py-2 pr-4">{{ r.type }}</td>
        <td class="py-2 pr-4 text-right">${{ "{:,.2f}".format(r.balance|float) }}</td>
        <td class="py-2 pr-2 text-right">
          <a href="/accounts/{{ r.id }}/edit" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg">Edit</a>
        </td>
      </tr>
      {% endfor %}
      {% if rows|length == 0 %}
      <tr><td colspan="4" class="py-6 text-center text-slate-400">No accounts yet.</td></tr>
      {% endif %}
    </tbody>
  </table>
</div>
{% endblock %}
