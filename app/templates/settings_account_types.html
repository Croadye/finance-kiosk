{% extends "base.html" %}
{% block content %}
<h2 class="text-xl font-semibold mb-3">Account Types</h2>

<form method="post" action="/settings/account-types/update" class="bg-slate-900 rounded-2xl p-4 shadow space-y-2 max-w-xl">
  <input type="hidden" name="n" value="{{ types|length }}">
  <table class="min-w-full text-left text-sm">
    <thead class="text-slate-400">
      <tr><th class="py-2 pr-4">Type name</th><th class="py-2 pr-4">Is debt?</th></tr>
    </thead>
    <tbody>
      {% for t in types %}
      <tr class="border-b border-slate-800">
        <td class="py-2 pr-4">
          <input name="name_{{ loop.index0 }}" value="{{ t.name }}" class="w-64 bg-slate-800 rounded-xl px-3 py-2">
        </td>
        <td class="py-2 pr-4">
          <input type="checkbox" name="is_debt_{{ loop.index0 }}" {% if t.is_debt %}checked{% endif %}>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  <div class="pt-3 flex justify-end">
    <button class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white">Save Changes</button>
  </div>
</form>

<form method="post" action="/settings/account-types/add" class="bg-slate-900 rounded-2xl p-4 shadow space-y-2 max-w-xl mt-4">
  <h3 class="font-semibold">Add New Type</h3>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
    <input name="name" placeholder="e.g., brokerage" class="bg-slate-800 rounded-xl px-3 py-2">
    <label class="inline-flex items-center gap-2">
      <input type="checkbox" name="is_debt"> Is debt?
    </label>
  </div>
  <div class="pt-2 flex justify-end">
    <button class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700">Add</button>
  </div>
</form>
{% endblock %}
