{% extends "base.html" %}
{% block content %}
<form method="post" action="/recurring" class="max-w-xl bg-slate-900 rounded-2xl p-4 shadow space-y-3">
  <h2 class="text-lg font-semibold">New Recurring Item</h2>

  <div>
    <label class="block text-sm text-slate-300 mb-1">Name</label>
    <input name="name" class="w-full bg-slate-800 rounded-xl px-3 py-2" placeholder="e.g., Mortgage" required>
  </div>

  <div>
    <label class="block text-sm text-slate-300 mb-1">Kind</label>
    <label class="inline-flex items-center gap-2 mr-4"><input type="radio" name="kind" value="expense" checked> Expense</label>
    <label class="inline-flex items-center gap-2"><input type="radio" name="kind" value="income"> Income</label>
  </div>

  <div>
    <label class="block text-sm text-slate-300 mb-1">Amount</label>
    <input name="amount" inputmode="decimal" class="w-full bg-slate-800 rounded-xl px-3 py-2" placeholder="e.g., 1850.00" required>
  </div>

  <div>
    <label class="block text-sm text-slate-300 mb-1">Cadence</label>
    <select name="cadence" class="w-full bg-slate-800 rounded-xl px-3 py-2">
      <option value="monthly">Monthly</option>
      <option value="biweekly">Biweekly</option>
      <option value="weekly">Weekly</option>
    </select>
  </div>

  <div>
    <label class="block text-sm text-slate-300 mb-1">Next due date</label>
    <input type="date" name="next_due" class="w-full bg-slate-800 rounded-xl px-3 py-2" required>
  </div>

  <div>
    <label class="block text-sm text-slate-300 mb-1">Account</label>
    <select name="account_id" class="w-full bg-slate-800 rounded-xl px-3 py-2" required>
      {% for id, name in accounts %}
      <option value="{{id}}">{{name}}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label class="block text-sm text-slate-300 mb-1">Category</label>
    <select name="category_id" class="w-full bg-slate-800 rounded-xl px-3 py-2">
      {% for id, name in categories %}
      <option value="{{id}}">{{name}}</option>
      {% endfor %}
    </select>
  </div>

  <div class="flex items-center gap-2 mt-2">
    <input id="autopost" type="checkbox" name="autopost" value="1" class="scale-125">
    <label for="autopost" class="text-slate-300">Autopost (uncheck to ask every time)</label>
  </div>

  <div class="pt-3 flex justify-end">
    <button class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white">Save</button>
  </div>
</form>
{% endblock %}
